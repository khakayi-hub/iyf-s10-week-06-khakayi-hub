<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1> Weather App</h1>

        <!-- Search Form -->
        <form id="search-form">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Enter city name..." 
                required
            >
            <button type="submit">Search</button>
        </form>

        <!-- Loading -->
        <div id="loading" class="hidden">Loading...</div>

        <!-- Error -->
        <div id="error" class="error hidden"></div>

        <!-- Weather Display -->
        <div id="weather-display" class="card hidden">
            <h2 id="city-name"></h2>
            <img id="weather-icon" alt="Weather Icon">
            <h3 id="temperature"></h3>
            <p id="description"></p>

            <div class="details">
                <p id="feels-like"></p>
                <p id="humidity"></p>
                <p id="wind"></p>
                <p id="pressure"></p>
            </div>
        </div>

        <!-- Search History -->
        <div class="history-container">
            <h3>Recent Searches</h3>
            <ul id="history"></ul>
        </div>
    </div>

    <script src="apps.js"></script>
</body>
</html>
