<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, textarea {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .post {
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
        }

        #loading {
            display: none;
            color: green;
        }
    </style>
</head>
<body>

<h1>Create Post</h1>

<form id="postForm">
    <input type="text" id="title" placeholder="Post title" required />
    <textarea id="body" placeholder="Post body" required></textarea>
    <button type="submit">Submit</button>
</form>

<p id="loading">Posting...</p>

<div id="posts"></div>

<script src="app.js"></script>

</body>
</html>
